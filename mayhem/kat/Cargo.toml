# Known-answer probe for mayhem/test.sh. Its own workspace (the upstream root workspace is untouched);
# mayhem/kat/Cargo.lock is a copy of upstream's root Cargo.lock so the dependency graph is the same pinned one.
[package]
name = "kat"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
bytemuck = "1.24.0"
risc0-circuit-rv32im = { version = "5.0.0", default-features = false, path = "../../risc0/circuit/rv32im" }
